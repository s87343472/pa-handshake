<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111318"/></marker></defs><style>text{font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#111318;font-size:14px}.t{font-size:15px;font-weight:700}.s{font-size:12.5px;fill:#5B6270}.xs{font-size:11.5px}.h{font-size:11.5px;font-weight:700;letter-spacing:.08em;fill:#5B6270}.m{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12px}.c{fill:#00798C}.pk{fill:#C2186B}.b{font-weight:700}.ln{stroke:#111318;stroke-width:1.6;fill:none}.lg{stroke:#9AA1AD;stroke-width:1.4;fill:none}.d{stroke-dasharray:5 4}</style><rect width="800" height="400" fill="#fff"/><text class="h" x="30" y="34">SAME DASHBOARD, SAME MODEL (SONNET), TWO READINGS</text><rect x="30" y="52" width="360" height="300" rx="18" fill="#F3F4F6" stroke="#5B6270" stroke-width="1.4"/><text class="h" x="52" y="82" style="fill:#5B6270">WITHOUT THE SKILL · RUN 5</text><text x="52" y="112" style="font-size:13.5px">"The numbers are internally</text><text x="52" y="132" style="font-size:13.5px">consistent and match the public</text><text x="52" y="152" style="font-size:13.5px">page on downloads [...] But the link</text><text x="52" y="172" style="font-size:13.5px">came from Alex's side on a domain</text><text x="52" y="192" style="font-size:13.5px">they control, so it isn't independent</text><text x="52" y="212" style="font-size:13.5px">verification. Ask for a screen share</text><text x="52" y="232" style="font-size:13.5px">or an App Store Connect screenshot</text><text x="52" y="252" style="font-size:13.5px">if this matters for a deal."</text><text class="xs" x="52" y="330" style="fill:#5B6270;font-weight:700">Misses 47% vs 22%. Offers a screenshot as a check.</text><rect x="410" y="52" width="360" height="300" rx="18" fill="#E0FBFF" stroke="#00798C" stroke-width="1.4"/><text class="h" x="432" y="82" style="fill:#00798C">WITH THE SKILL · RUN 2</text><text x="432" y="112" style="font-size:13.5px">"I saw the figures directly (level 2),</text><text x="432" y="132" style="font-size:13.5px">but the dashboard sits on Shelfie's</text><text x="432" y="152" style="font-size:13.5px">own domain, not Apple's, so I weigh</text><text x="432" y="172" style="font-size:13.5px">it below platform data. [...] MAU is</text><text x="432" y="192" style="font-size:13.5px">about 47% of all-time downloads.</text><text x="432" y="212" style="font-size:13.5px">That's possible [...] but it's a high</text><text x="432" y="232" style="font-size:13.5px">ratio next to 22% D30. [...] I want to</text><text x="432" y="252" style="font-size:13.5px">re-ask it in a different form."</text><text class="xs" x="432" y="330" style="fill:#00798C;font-weight:700">Ranks it, flags the tension, re-asks.</text><text class="s" x="30" y="380">Quoted verbatim from tests/evidence/results/2026-11-27/E2-without-sonnet-5.txt and E2-with-sonnet-2.txt.</text></svg>