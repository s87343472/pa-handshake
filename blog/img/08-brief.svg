<text class="h" x="240" y="276">TERMS</text><text class="s" x="240" y="296">fit</text><rect class="g" x="270" y="290" width="120" height="7" rx="3"/><text class="x" x="400" y="296">clash</text><rect class="g" x="440" y="290" width="100" height="7" rx="3"/>
