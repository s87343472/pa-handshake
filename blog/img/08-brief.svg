<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141413"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2603F"/></marker></defs><style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#141413;font-size:14px}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#6B6A65}.x{font-size:12.5px;fill:#C2603F}.h{font-size:13px;font-weight:600;letter-spacing:.04em;fill:#6B6A65}.b{fill:#fff;stroke:#141413;stroke-width:1.5}.l{stroke:#141413;stroke-width:1.5;fill:none}.d{stroke-dasharray:5 4}.ol{stroke:#C2603F;stroke-width:1.5;fill:none}.p{fill:#F0EEE6}.q{fill:#F7E4DA}.g{fill:#E3E1D9}</style><rect width="800" height="540" fill="#FAF9F5"/>
