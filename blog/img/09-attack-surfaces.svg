<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111318"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF2E97"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00798C"/></marker></defs><style>text{font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#111318;font-size:14px}.t{font-size:15px;font-weight:700}.s{font-size:12.5px;fill:#5B6270}.h{font-size:11.5px;font-weight:700;letter-spacing:.08em;fill:#5B6270}.m{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12px}.c{fill:#00798C}.pk{fill:#C2186B}.w{fill:#fff}.tile{fill:#F3F4F6}.ink{fill:#111318}.ln{stroke:#111318;stroke-width:1.6;fill:none}.lc{stroke:#00798C;stroke-width:1.8;fill:none}.lp{stroke:#FF2E97;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style>
