PA opened itself</text><text class="s" x="400" y="151">Live, but may sit on their own domain</text><rect x="668" y="140" width="14" height="14" rx="3" fill="#00798C"/><rect x="688" y="140" width="14" height="14" rx="3" fill="#00798C"/><rect x="708" y="140" width="14" height="14" rx="3" fill="#00798C"/><rect x="728" y="140" width="14" height="14" rx="3" fill="#00798C"/><rect x="748" y="140" width="14" height="14" rx="3" fill="#E6E8EC"/><rect x="20" y="184" width="760" height="56" rx="12" fill="#F7F8FA"/><text class="m" x="40" y="218" style="font-size:18px;font-weight:700;fill:#00798C">3</text><text x="70" y="209" style="font-weight:700;font-size:14px">Long public history</text><text class="s" x="70" y="228">Dated posts, releases, archived pages</text><text class="s" x="400" y="217">Cheap to have, costly to fake after the fact</text><rect x="668" y="206" width="14" height="14" rx="3" fill="#00798C"/><rect x="688" y="206" width="14" height="14" rx="3" fill="#00798C"/><rect x="708" y="206" width="14" height="14" rx="3" fill="#00798C"/><rect x="728" y="206" width="14" height="14" rx="3" fill="#E6E8EC"/><rect x="748" y="206" width="14" height="14" rx="3" fill="#E6E8EC"/><rect x="20" y="250" width="760" height="56" rx="12" fill="#fff"/><text class="m" x="40" y="284" style="font-size:18px;font-weight:700;fill:#9AA1AD">4</text><text x="70" y="275" style="font-weight:700;font-size:14px">The other PA's statement</text><text class="s" x="70" y="294">Cites material its owner released</text><text class="s" x="400" y="283">Only as good as what it was given</text><rect x="668" y="272" width="14" height="14" rx="3" fill="#00798C"/><rect x="688" y="272" width="14" height="14" rx="3" fill="#00798C"/><rect x="708" y="272" width="14" height="14" rx="3" fill="#E6E8EC"/><rect x="728" y="272" width="14" height="14" rx="3" fill="#E6E8EC"/><rect x="748" y="272" width="14" height="14" rx="3" fill="#E6E8EC"/><rect x="20" y="316" width="760" height="56" rx="12" fill="#F7F8FA"/><text class="m" x="40" y="350" style="font-size:18px;font-weight:700;fill:#9AA1AD">5</text><text x="70" y="341" style="font-weight:700;font-size:14px">Their own claim</text><text class="s" x="70" y="360">Including screenshots and pasted numbers</text><text class="s" x="400" y="349">Anyone can make one in a minute</text><rect x="668" y="338" width="14" height="14" rx="3" fill="#00798C"/><rect x="688" y="338" width="14" height="14" rx="3" fill="#E6E8EC"/><rect x="708" y="338" width="14" height="14" rx="3" fill="#E6E8EC"/><rect x="728" y="338" width="14" height="14" rx="3" fill="#E6E8EC"/><rect x="748" y="338" width="14" height="14" rx="3" fill="#E6E8EC"/><text class="h" x="762" y="34" text-anchor="end">HARD TO FAKE</text><text class="s" x="30" y="412" style="fill:#C2186B;font-weight:600">A screenshot of a live dashboard sits at level 5, even though the dashboard itself would be level 2.</text></svg>