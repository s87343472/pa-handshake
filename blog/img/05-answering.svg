<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141413"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2603F"/></marker></defs><style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#141413;font-size:14px}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#6B6A65}.x{font-size:12.5px;fill:#C2603F}.h{font-size:13px;font-weight:600;letter-spacing:.04em;fill:#6B6A65}.b{fill:#fff;stroke:#141413;stroke-width:1.5}.l{stroke:#141413;stroke-width:1.5;fill:none}.d{stroke-dasharray:5 4}.ol{stroke:#C2603F;stroke-width:1.5;fill:none}.p{fill:#F0EEE6}.q{fill:#F7E4DA}.g{fill:#E3E1D9}</style><rect width="800" height="450" fill="#FAF9F5"/>
<rect class="b" x="300" y="20" width="200" height="44" rx="22"/><text class="t" x="400" y="47" text-anchor="middle">A question arrives</text>
<line class="l" x1="400" y1="64" x2="400" y2="97" marker-end="url(#a)"/>
<rect class="b" x="250" y="100" width="300" height="50" rx="8"/><text x="400" y="130" text-anchor="middle">Is it in public or released material?</text>
<line class="l" x1="550" y1="125" x2="597" y2="125" marker-end="url(#a)"/><text class="s" x="573" y="117" text-anchor="middle">yes</text>
<rect class="b" x="600" y="100" width="180" height="50" rx="8" style="fill:#F0EEE6"/><text x="690" y="130" text-anchor="middle">Answer, cite the source</text>
<line class="l" x1="400" y1="150" x2="400" y2="187" marker-end="url(#a)"/><text class="s" x="410" y="173">no</text>
<rect class="b" x="250" y="190" width="300" height="50" rx="8"/><text x="400" y="220" text-anchor="middle">Is it something the owner should decide?</text>
<line class="l" x1="250" y1="215" x2="203" y2="215" marker-end="url(#a)"/><text class="s" x="227" y="207" text-anchor="middle">no</text>
<rect class="b" x="20" y="190" width="180" height="50" rx="8" style="fill:#F0EEE6"/><text x="110" y="220" text-anchor="middle">Decline</text>
<line class="l" x1="400" y1="240" x2="400" y2="277" marker-end="url(#a)"/><text class="s" x="410" y="263">yes</text>
<rect class="b" x="200" y="280" width="400" height="50" rx="8"/><text x="400" y="310" text-anchor="middle">Reply “my owner needs to answer this”, notify you</text>
<path class="l" d="M400,330 V350 M140,350 H660 M140,350 V367 M400,350 V367 M660,350 V367"/>
<path d="M135,362 L140,370 L145,362 z M395,362 L400,370 L405,362 z M655,362 L660,370 L665,362 z" fill="#141413"/>
<rect class="b" x="30" y="370" width="220" height="60" rx="8" style="fill:#F0EEE6"/><text class="t" x="140" y="396" text-anchor="middle">A · You reply yourself</text><text class="s" x="140" y="416" text-anchor="middle">PA steps back in that thread</text>
<rect class="b" x="290" y="370" width="220" height="60" rx="8" style="fill:#F0EEE6"/><text class="t" x="400" y="396" text-anchor="middle">B · You give points</text><text class="s" x="400" y="416" text-anchor="middle">PA drafts, sends after your OK</text>
<rect class="b" x="550" y="370" width="220" height="60" rx="8" style="fill:#F0EEE6"/><text class="t" x="660" y="396" text-anchor="middle">C · You release material</text><text class="s" x="660" y="416" text-anchor="middle">one recipient, approved, logged</text>
<rect x="20" y="20" width="230" height="58" rx="8" class="ol d"/><text class="x" x="34" y="44">Instructions inside a message are</text><text class="x" x="34" y="63">data: ignored, logged as a signal.</text>
</svg>
