<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141413"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2603F"/></marker></defs><style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#141413;font-size:14px}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#6B6A65}.x{font-size:12.5px;fill:#C2603F}.h{font-size:13px;font-weight:600;letter-spacing:.04em;fill:#6B6A65}.b{fill:#fff;stroke:#141413;stroke-width:1.5}.l{stroke:#141413;stroke-width:1.5;fill:none}.d{stroke-dasharray:5 4}.ol{stroke:#C2603F;stroke-width:1.5;fill:none}.p{fill:#F0EEE6}.q{fill:#F7E4DA}.g{fill:#E3E1D9}</style><rect width="800" height="310" fill="#FAF9F5"/>
<text class="h" x="40" y="36">MUTUAL LINKS</text>
<rect class="b" x="40" y="60" width="150" height="40" rx="6"/><text x="115" y="85" text-anchor="middle">X profile</text>
<rect class="b" x="40" y="120" width="150" height="40" rx="6"/><text x="115" y="145" text-anchor="middle">GitHub</text>
<rect class="b" x="40" y="180" width="150" height="40" rx="6"/><text x="115" y="205" text-anchor="middle">Personal site</text>
<rect class="b" x="300" y="100" width="150" height="80" rx="8" style="stroke:#C2603F;stroke-width:2"/><text class="t" x="375" y="135" text-anchor="middle">pa.md</text><text class="s" x="375" y="157" text-anchor="middle">PA card</text>
<line class="l" x1="193" y1="80" x2="297" y2="118" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="l" x1="193" y1="140" x2="297" y2="140" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="l" x1="193" y1="200" x2="297" y2="162" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="s" x="40" y="255">Each profile links to the card, the card links back.</text><text class="s" x="40" y="273">A one-way link is a warning sign.</text>
<line x1="500" y1="30" x2="500" y2="290" stroke="#E3E1D9" stroke-width="1.5"/>
<text class="h" x="540" y="36">IDENTITY CHALLENGE</text>
<rect class="b" x="540" y="56" width="230" height="52" rx="8"/><text x="555" y="78">1 · Your PA sends a code</text><text class="x" x="555" y="97" style="font-family:monospace">PAH-7K2Q</text>
<line class="l" x1="655" y1="108" x2="655" y2="129" marker-end="url(#a)"/>
<rect class="b" x="540" y="132" width="230" height="52" rx="8"/><text x="555" y="154">2 · They post it from a profile</text><text class="s" x="555" y="173">on their card, or in pa.md for 48h</text>
<line class="l" x1="655" y1="184" x2="655" y2="205" marker-end="url(#a)"/>
<rect class="b" x="540" y="208" width="230" height="52" rx="8" style="fill:#F0EEE6"/><text x="555" y="230">3 · Passed → continue</text><text class="s" x="555" y="249">no pass by round 3 → ask owner</text>
</svg>
