<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141413"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2603F"/></marker></defs><style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#141413;font-size:14px}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#6B6A65}.x{font-size:12.5px;fill:#C2603F}.h{font-size:13px;font-weight:600;letter-spacing:.04em;fill:#6B6A65}.b{fill:#fff;stroke:#141413;stroke-width:1.5}.l{stroke:#141413;stroke-width:1.5;fill:none}.d{stroke-dasharray:5 4}.ol{stroke:#C2603F;stroke-width:1.5;fill:none}.p{fill:#F0EEE6}.q{fill:#F7E4DA}.g{fill:#E3E1D9}</style><rect width="800" height="380" fill="#FAF9F5"/>
<rect class="b" x="40" y="110" width="150" height="80" rx="8"/><text class="t" x="115" y="145" text-anchor="middle">You</text><text class="s" x="115" y="167" text-anchor="middle">the owner</text>
<rect class="b" x="325" y="110" width="150" height="80" rx="8" style="stroke:#C2603F;stroke-width:2"/><text class="t" x="400" y="145" text-anchor="middle">Your PA</text><text class="s" x="400" y="167" text-anchor="middle">any agent + SKILL.md</text>
<rect class="b" x="610" y="110" width="150" height="80" rx="8"/><text class="t" x="685" y="145" text-anchor="middle">Them</text><text class="s" x="685" y="167" text-anchor="middle">or their PA</text>
<rect class="b" x="325" y="280" width="150" height="64" rx="8" style="fill:#F0EEE6"/><text class="t" x="400" y="308" text-anchor="middle">Public web</text><text class="s" x="400" y="328" text-anchor="middle">cards, repos, posts</text>
<rect class="b" x="40" y="280" width="150" height="64" rx="8" style="fill:#F0EEE6"/><text class="t" x="115" y="308" text-anchor="middle">⑤ You decide</text><text class="s" x="115" y="328" text-anchor="middle">take the call or not</text>
<line class="l" x1="190" y1="135" x2="322" y2="135" marker-end="url(#a)"/><text class="s" x="257" y="126" text-anchor="middle">① who + direction</text>
<line class="l" x1="325" y1="168" x2="193" y2="168" marker-end="url(#a)"/><text class="s" x="257" y="186" text-anchor="middle">④ one-page brief</text>
<line class="l" x1="475" y1="135" x2="607" y2="135" marker-end="url(#a)"/><text class="s" x="542" y="126" text-anchor="middle">③ questions</text>
<line class="l" x1="610" y1="168" x2="478" y2="168" marker-end="url(#a)"/><text class="s" x="542" y="186" text-anchor="middle">answers, ≤10 rounds</text>
<line class="l d" x1="400" y1="190" x2="400" y2="277" marker-end="url(#a)"/><text class="s" x="410" y="240">② read their history first</text>
<path class="l d" d="M685,190 V312 H478" marker-end="url(#a)"/><text class="s" x="580" y="304" text-anchor="middle">their public record</text>
<line class="l" x1="115" y1="190" x2="115" y2="277" marker-end="url(#a)"/>
<text class="s" x="40" y="60">All messages are plain email. You get a copy of every one your PA sends.</text>
