<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141413"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2603F"/></marker></defs><style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#141413;font-size:14px}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#6B6A65}.x{font-size:12.5px;fill:#C2603F}.h{font-size:13px;font-weight:600;letter-spacing:.04em;fill:#6B6A65}.b{fill:#fff;stroke:#141413;stroke-width:1.5}.l{stroke:#141413;stroke-width:1.5;fill:none}.d{stroke-dasharray:5 4}.ol{stroke:#C2603F;stroke-width:1.5;fill:none}.p{fill:#F0EEE6}.q{fill:#F7E4DA}.g{fill:#E3E1D9}</style><rect width="800" height="300" fill="#FAF9F5"/>
<rect class="p" x="20" y="20" width="370" height="260" rx="10"/><text class="h" x="40" y="50">A · THEY HAVE NO AGENT</text>
<rect class="b" x="45" y="95" width="130" height="60" rx="8" style="stroke:#C2603F;stroke-width:2"/><text class="t" x="110" y="130" text-anchor="middle">Your PA</text>
<rect class="b" x="235" y="95" width="130" height="60" rx="8"/><text class="t" x="300" y="122" text-anchor="middle">Them</text><text class="s" x="300" y="142" text-anchor="middle">a normal inbox</text>
<line class="l" x1="175" y1="115" x2="232" y2="115" marker-end="url(#a)"/><line class="l" x1="235" y1="137" x2="178" y2="137" marker-end="url(#a)"/>
<text class="s" x="45" y="195">Reads their public history first,</text><text class="s" x="45" y="215">then emails the person directly.</text><text class="s" x="45" y="235">They can stop at any time.</text>
<rect class="p" x="410" y="20" width="370" height="260" rx="10"/><text class="h" x="430" y="50">B · THEY HAVE AN AGENT</text>
<rect class="b" x="435" y="95" width="130" height="60" rx="8" style="stroke:#C2603F;stroke-width:2"/><text class="t" x="500" y="130" text-anchor="middle">Your PA</text>
<rect class="b" x="625" y="95" width="130" height="60" rx="8" style="stroke:#C2603F;stroke-width:2"/><text class="t" x="690" y="130" text-anchor="middle">Their PA</text>
<line class="l" x1="565" y1="115" x2="622" y2="115" marker-end="url(#a)"/><line class="l" x1="625" y1="137" x2="568" y2="137" marker-end="url(#a)"/>
<text class="s" x="435" y="195">The two agents run the rounds.</text><text class="s" x="435" y="215">Each owner gets a copy of every message.</text><text class="s" x="435" y="235">Same rules, just faster.</text>
</svg>
